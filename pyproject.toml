[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixiv-archive-lab"
version = "0.1.0a1"
description = "Local, bounded Pixiv archive research prototype with reproducible offline fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pixiv Archive Lab contributors"}]
dependencies = []

[project.scripts]
pixiv-archive = "pixiv_archive.cli:main"
opixiv = "pixiv_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

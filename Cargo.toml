[package]
name = "open-pixiv-downloader"
version = "0.2.0-alpha.6"
edition = "2021"
rust-version = "1.89"
description = "Local Pixiv archive CLI and Ratatui terminal interface"
license = "MIT"
repository = "https://github.com/ELRdn/Open-Pixiv-Downloader"
default-run = "opixiv"

[[bin]]
name = "opixiv"
path = "rust/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.4"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "2"
unicode-width = "0.2"
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
self-replace = "1.5"

[profile.release]
lto = "thin"
strip = true
